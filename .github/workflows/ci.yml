name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image test dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate public repository contract
        run: python scripts/validate_repo.py
      - name: Run focused tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q scripts skills/album-cover-director/scripts research tests
