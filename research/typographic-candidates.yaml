{
  "schema_version": 1,
  "purpose": "Screening ledger for globally diverse album covers acclaimed for their visual design and organized primarily by typography, lettering, numerals, or title glyphs.",
  "selection_contract": {
    "music_quality_is_not_evidence": true,
    "required_acclaim": "At least one cover-specific award, museum or archive selection, or close reading by a recognized design institution. Package awards are provisional until the front cover is independently screened.",
    "required_typography_dominance": ["T4", "T5"],
    "T4": "Lettering is the strongest organizing mass or first fixation; imagery is subordinate or structurally dependent on it.",
    "T5": "Lettering, a numeral, a wordmark, or a title glyph can identify and organize the cover without the image.",
    "exclude": [
      "music-publication lists without design-specific evidence",
      "covers admitted only because the album is famous",
      "T3 balanced image-and-type covers unless retained as a documented rejection",
      "package winners whose front cover is not typography-dominant",
      "unverified designer credits",
      "third-party image files"
    ],
    "status_lifecycle": {
      "visual-pass": "The square cover was directly inspected and met T4 or T5; credit and source separation may still be incomplete.",
      "visual-second-pass": "The cover is close to the T3/T4 boundary and must be compared again at full size and 56 px.",
      "evidence-complete": "Visual pass, cover-specific acclaim, designer credit, and distinct source fields are all verified; eligible for the final corpus.",
      "rejected": "Retained only as a documented boundary example."
    }
  },
  "checkpoint_contract": {
    "candidate_pool_target": 180,
    "visual_checkpoints": [40, 80, 120],
    "final_corpus_target": 120,
    "final_era_counts": {
      "1940-1979": 30,
      "1980-1999": 30,
      "2000-2014": 30,
      "2015-present": 30
    },
    "final_minimums": {
      "regions": 8,
      "genre_systems": 12,
      "non_latin_or_mixed_script": 24,
      "T5": 60
    },
    "anti_concentration": "No designer, label, country, genre system, or source may become a shortcut for acclaim or typography quality."
  },
